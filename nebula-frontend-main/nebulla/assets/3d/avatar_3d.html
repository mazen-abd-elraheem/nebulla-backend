<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realistic 3D Female Human Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: transparent;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, clock;
    let avatarModel, headBone, neckBone, spineBone;
    let morphMeshes = [];

    // Target parameters updated in real-time from Flutter
    const avatarState = {
      mouth: 0.0,
      blink: 0.0,
      pitch: 0.0,
      yaw: 0.0,
      roll: 0.0,
      gazeX: 0.0,
      gazeY: 0.0,
      breath: 0.0,
      smile: 0.15
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth || 400;
      const height = window.innerHeight || 600;

      clock = new THREE.Clock();

      // 1. WebGL Renderer with transparency & ACES tone mapping
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 2. Scene
      scene = new THREE.Scene();

      // 3. Camera focused on portrait headshot (face & shoulders)
      camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 100);
      camera.position.set(0, 1.48, 0.72); // Optimal close-up face framing

      // 4. Studio Lighting for realistic human skin
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      // Warm Key Light (Front Right)
      const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.3);
      keyLight.position.set(1.2, 2.2, 1.4);
      scene.add(keyLight);

      // Soft Fill Light (Front Left)
      const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.7);
      fillLight.position.set(-1.2, 1.6, 1.2);
      scene.add(fillLight);

      // Cybernetic Accent Rim Light (Behind & Above)
      const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.4);
      rimLight.position.set(0.0, 2.0, -1.2);
      scene.add(rimLight);

      // 5. Load the High-Quality Realistic Female GLB Model
      loadModel();

      window.addEventListener('resize', onResize);
      animate();
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      const modelUrl = '../models/female_avatar.glb';

      loader.load(
        modelUrl,
        function (gltf) {
          avatarModel = gltf.scene;
          avatarModel.position.set(0, 0, 0);

          // Find skeletal bones and morph target meshes
          avatarModel.traverse(function (node) {
            if (node.isBone) {
              const name = node.name.toLowerCase();
              if (name === 'head') headBone = node;
              if (name === 'neck') neckBone = node;
              if (name.includes('spine2') || name.includes('spine1')) spineBone = node;
            }

            if (node.isMesh && node.morphTargetDictionary) {
              morphMeshes.push(node);
            }

            if (node.isMesh && node.material) {
              node.castShadow = true;
              node.receiveShadow = true;
              // Ensure skin shaders render smoothly with realistic subsurface look
              if (node.material.roughness !== undefined) {
                node.material.roughness = Math.max(0.42, node.material.roughness);
              }
            }
          });

          scene.add(avatarModel);
          console.log('3D Female Human Avatar Loaded Successfully.');
        },
        undefined,
        function (error) {
          console.error('Error loading 3D avatar GLB:', error);
        }
      );
    }

    function setMorphTarget(targetName, value) {
      for (let i = 0; i < morphMeshes.length; i++) {
        const mesh = morphMeshes[i];
        const dict = mesh.morphTargetDictionary;
        if (dict && dict[targetName] !== undefined) {
          const index = dict[targetName];
          mesh.morphTargetInfluences[index] = THREE.MathUtils.clamp(value, 0, 1);
        }
      }
    }

    // Called continuously from Flutter Controller
    window.updateAvatar = function (params) {
      if (!params) return;
      if (typeof params.mouth !== 'undefined') avatarState.mouth = params.mouth;
      if (typeof params.blink !== 'undefined') avatarState.blink = params.blink;
      if (typeof params.pitch !== 'undefined') avatarState.pitch = params.pitch;
      if (typeof params.yaw !== 'undefined') avatarState.yaw = params.yaw;
      if (typeof params.roll !== 'undefined') avatarState.roll = params.roll;
      if (typeof params.gazeX !== 'undefined') avatarState.gazeX = params.gazeX;
      if (typeof params.gazeY !== 'undefined') avatarState.gazeY = params.gazeY;
      if (typeof params.breath !== 'undefined') avatarState.breath = params.breath;
      if (typeof params.smile !== 'undefined') avatarState.smile = params.smile;
    };

    function animate() {
      requestAnimationFrame(animate);

      // 1. Skeletal Head & Neck Kinematics
      if (headBone) {
        headBone.rotation.x = avatarState.pitch;
        headBone.rotation.y = avatarState.yaw;
        headBone.rotation.z = avatarState.roll;
      }

      if (neckBone) {
        neckBone.rotation.x = avatarState.pitch * 0.35;
        neckBone.rotation.y = avatarState.yaw * 0.35;
        neckBone.rotation.z = avatarState.roll * 0.35;
      }

      // 2. Breathing Motion (Torso / Spine displacement)
      if (spineBone) {
        spineBone.position.y = avatarState.breath * 0.003;
      }

      // 3. Eyelid Morph Targets (Blinking)
      setMorphTarget('eyeBlinkLeft', avatarState.blink);
      setMorphTarget('eyeBlinkRight', avatarState.blink);
      setMorphTarget('eyesClosed', avatarState.blink);

      // 4. Eye Gaze Morph Targets (Looking Left/Right/Up/Down)
      const gazeX = avatarState.gazeX;
      const gazeY = avatarState.gazeY;

      if (gazeX > 0) {
        setMorphTarget('eyeLookOutLeft', gazeX);
        setMorphTarget('eyeLookInRight', gazeX);
        setMorphTarget('eyeLookInLeft', 0);
        setMorphTarget('eyeLookOutRight', 0);
      } else {
        const absX = Math.abs(gazeX);
        setMorphTarget('eyeLookInLeft', absX);
        setMorphTarget('eyeLookOutRight', absX);
        setMorphTarget('eyeLookOutLeft', 0);
        setMorphTarget('eyeLookInRight', 0);
      }

      if (gazeY > 0) {
        setMorphTarget('eyeLookUpLeft', gazeY);
        setMorphTarget('eyeLookUpRight', gazeY);
        setMorphTarget('eyeLookDownLeft', 0);
        setMorphTarget('eyeLookDownRight', 0);
      } else {
        const absY = Math.abs(gazeY);
        setMorphTarget('eyeLookDownLeft', absY);
        setMorphTarget('eyeLookDownRight', absY);
        setMorphTarget('eyeLookUpLeft', 0);
        setMorphTarget('eyeLookUpRight', 0);
      }

      // 5. Realistic Mouth & Jaw Morph Targets (Talking & Lip-sync)
      const mouthVal = avatarState.mouth;
      setMorphTarget('mouthOpen', mouthVal);
      setMorphTarget('jawOpen', mouthVal * 0.85);
      setMorphTarget('viseme_aa', mouthVal * 0.65);
      setMorphTarget('viseme_O', mouthVal * 0.40);
      setMorphTarget('mouthSmile', avatarState.smile);
      setMorphTarget('mouthSmileLeft', avatarState.smile * 0.8);
      setMorphTarget('mouthSmileRight', avatarState.smile * 0.8);

      renderer.render(scene, camera);
    }

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
